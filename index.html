<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Clicker Ultra</title>
  <style>
    :root {
      --bg1: #3b1d0f;
      --bg2: #f2c14e;
      --panel: rgba(30, 18, 10, 0.85);
      --gold: #ffd75a;
      --cream: #fff4d6;
      --accent: #9dff6a;
      --cookie: #d9862c;
      --brown: #6a3f1d;
      --dark: #1e120d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, var(--bg1), #5a2d10 40%, #7c4315);
      color: var(--cream);
      user-select: none;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
      position: relative;
    }

    .floating-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }

    .game {
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      display: flex;
      background: rgba(0,0,0,0.08);
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background: linear-gradient(135deg, rgba(238,176,71,0.12), rgba(255,255,255,0.04));
      overflow: hidden;
      position: relative;
    }

    .stats {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
      max-width: 700px;
      z-index: 10;
    }

    .stat {
      background: rgba(25, 15, 8, 0.6);
      border: 2px solid rgba(255, 215, 90, 0.7);
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 160px;
      text-align: center;
      box-shadow: 0 0 18px rgba(255, 215, 90, 0.18);
    }

    .label {
      display: block;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ebd7a7;
      margin-bottom: 4px;
    }

    .value {
      font-size: clamp(18px, 2vw, 32px);
      font-weight: 700;
      color: var(--gold);
      font-family: "Consolas", "Courier New", monospace;
      text-shadow: 0 0 12px rgba(255, 215, 90, 0.35);
    }

    .cookie-wrap {
      margin-top: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .cookie {
      width: min(42vw, 320px);
      height: min(42vw, 320px);
      max-width: 320px;
      max-height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffe699 0%, #ffd05c 18%, var(--cookie) 42%, #b86621 70%, #7a3d17 100%);
      border: 8px solid rgba(120, 70, 30, 0.8);
      box-shadow: 
        0 0 30px rgba(255, 193, 56, 0.7),
        inset -16px -18px 26px rgba(77, 35, 9, 0.36),
        inset 18px 16px 24px rgba(255, 244, 196, 0.35);
      display: grid;
      place-items: center;
      font-size: clamp(108px, 18vw, 150px);
      cursor: pointer;
      user-select: none;
      transition: transform 0.05s ease, filter 0.08s ease, box-shadow 0.08s ease;
      touch-action: manipulation;
      will-change: transform, box-shadow, filter;
      position: relative;
    }

    .cookie:active {
      transform: scale(0.96);
      filter: brightness(1.08);
      box-shadow: 
        0 0 42px rgba(255, 193, 56, 0.9),
        inset -18px -18px 26px rgba(77, 35, 9, 0.5),
        inset 18px 16px 24px rgba(255, 244, 196, 0.4);
    }

    .cookie::before {
      content: "";
      position: absolute;
      inset: 18% 22% auto auto;
      width: 20%;
      height: 20%;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      filter: blur(1px);
    }

    .cps {
      font-size: clamp(16px, 2vw, 26px);
      font-weight: 700;
      color: var(--accent);
      font-family: "Consolas", "Courier New", monospace;
      text-shadow: 0 0 12px rgba(157, 255, 106, 0.25);
    }

    .sidebar {
      width: min(30vw, 390px);
      min-width: 280px;
      background: rgba(29, 18, 12, 0.9);
      border-left: 3px solid rgba(255, 215, 90, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: var(--gold);
      text-transform: uppercase;
      text-align: center;
      background: rgba(0,0,0,0.2);
      border-bottom: 2px solid rgba(255, 215, 90, 0.5);
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }

    .tab-buttons {
      display: flex;
      gap: 4px;
      padding: 8px;
      background: rgba(0,0,0,0.1);
      border-bottom: 1px solid rgba(255, 215, 90, 0.3);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid rgba(255, 215, 90, 0.4);
      background: rgba(255, 215, 90, 0.05);
      color: var(--gold);
      cursor: pointer;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: rgba(255, 215, 90, 0.2);
      border-color: rgba(157, 255, 106, 0.9);
      color: var(--accent);
    }

    .tab-btn:hover {
      background: rgba(255, 215, 90, 0.15);
    }

    .side-section {
      padding: 16px 14px 12px;
      border-bottom: 1px solid rgba(255, 215, 90, 0.3);
      overflow-y: auto;
      flex: 1;
      display: none;
    }

    .side-section.active {
      display: block;
    }

    .side-section:last-of-type {
      flex: 0;
      overflow: visible;
      max-height: none;
      border-bottom: none;
      padding: 12px 14px;
    }

    .section-title {
      color: #f8d98b;
      font-size: 12px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .upgrade-list, .achievement-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .upgrade {
      background: rgba(255, 215, 90, 0.06);
      border: 2px solid rgba(255, 215, 90, 0.55);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.12s ease, background 0.12s ease;
      box-shadow: inset 0 0 0 rgba(0,0,0,0);
    }

    .upgrade:hover {
      transform: translateX(-2px);
      border-color: rgba(157, 255, 106, 0.8);
      background: rgba(157, 255, 106, 0.08);
    }

    .upgrade.affordable {
      border-color: rgba(157, 255, 106, 0.9);
      background: rgba(157, 255, 106, 0.12);
      box-shadow: 0 0 12px rgba(157, 255, 106, 0.18);
    }

    .upgrade.purchased {
      opacity: 0.6;
      pointer-events: none;
      border-color: rgba(100, 200, 100, 0.7);
      background: rgba(100, 200, 100, 0.1);
    }

    .upgrade-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 4px;
    }

    .upgrade-cost {
      font-size: 12px;
      color: var(--gold);
      font-family: "Consolas", "Courier New", monospace;
      margin-bottom: 3px;
    }

    .upgrade-effect {
      font-size: 12px;
      color: #c9c0ad;
    }

    .achievement {
      background: rgba(255, 215, 90, 0.08);
      border: 2px solid rgba(255, 215, 90, 0.4);
      border-radius: 10px;
      padding: 12px;
      cursor: default;
      transition: all 0.2s;
      position: relative;
    }

    .achievement.unlocked {
      border-color: rgba(157, 255, 106, 0.9);
      background: rgba(157, 255, 106, 0.15);
      box-shadow: 0 0 15px rgba(157, 255, 106, 0.3);
    }

    .achievement.locked {
      opacity: 0.5;
    }

    .achievement-header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 4px;
    }

    .achievement-icon {
      font-size: 24px;
      min-width: 24px;
      text-align: center;
    }

    .achievement-info {
      flex: 1;
    }

    .achievement-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 2px;
    }

    .achievement-desc {
      font-size: 11px;
      color: #aaa;
    }

    .achievement-progress {
      font-size: 10px;
      color: var(--gold);
      font-family: "Consolas", "Courier New", monospace;
      margin-top: 4px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 10px;
      font-size: 13px;
    }

    .stat-key {
      color: #e8d3a2;
    }

    .stat-value-small {
      color: var(--gold);
      font-family: "Consolas", "Courier New", monospace;
      text-align: right;
    }

    .reset-btn {
      width: 100%;
      padding: 12px;
      border: 2px solid rgba(255, 215, 90, 0.7);
      border-radius: 10px;
      background: linear-gradient(135deg, #852a1b, #9f3a1d);
      color: white;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      background: linear-gradient(135deg, #a03520, #c04620);
    }

    .floating {
      position: fixed;
      font-size: 32px;
      font-weight: 800;
      color: #ffd75a;
      text-shadow: 0 0 12px rgba(255, 215, 90, 0.8), 0 0 24px rgba(255, 193, 56, 0.4);
      font-family: "Consolas", "Courier New", monospace;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
      will-change: transform, opacity;
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(157, 255, 106, 0.9);
      color: #000;
      padding: 16px 20px;
      border-radius: 10px;
      font-weight: 700;
      z-index: 10000;
      animation: slideIn 0.3s ease, slideOut 0.3s ease 2.7s;
      max-width: 300px;
      box-shadow: 0 0 20px rgba(157, 255, 106, 0.5);
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes slideOut {
      from {
        transform: translateX(0);
        opacity: 1;
      }
      to {
        transform: translateX(400px);
        opacity: 0;
      }
    }

    .sound-toggle {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 215, 90, 0.1);
      border: 2px solid rgba(255, 215, 90, 0.5);
      color: var(--gold);
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 100;
    }

    .sound-toggle:hover {
      background: rgba(255, 215, 90, 0.2);
      border-color: rgba(255, 215, 90, 0.8);
    }

    @media (max-width: 900px) {
      .game {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        max-height: 42vh;
        border-left: none;
        border-top: 3px solid rgba(255, 215, 90, 0.6);
      }

      .main {
        min-height: 58vh;
      }

      .cookie {
        width: min(58vw, 260px);
        height: min(58vw, 260px);
      }

      .sound-toggle {
        bottom: 10px;
        right: 10px;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="floating-container" id="floatingContainer"></div>

  <div class="game">
    <div class="main">
      <div class="stats">
        <div class="stat">
          <span class="label">Cookies</span>
          <span id="cookies" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Per Click</span>
          <span id="perClick" class="value">1</span>
        </div>
        <div class="stat">
          <span class="label">CPS</span>
          <span id="cps" class="value">0</span>
        </div>
      </div>

      <div class="cookie-wrap">
        <div id="cookie" class="cookie" aria-label="Cookie clicker" title="Click me!">🍪</div>
        <div id="cpsLabel" class="cps">Cookies per second: 0</div>
      </div>

      <button class="sound-toggle" id="soundToggle" title="Toggle Sound">🔊</button>
    </div>

    <aside class="sidebar">
      <div class="sidebar-header">🎮 Menu</div>

      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="store">Store</button>
        <button class="tab-btn" data-tab="upgrades">Upgrades</button>
        <button class="tab-btn" data-tab="achievements">Achievements</button>
      </div>

      <div class="side-section active" id="store-tab">
        <div class="section-title">Buildings</div>
        <div id="upgradeList" class="upgrade-list"></div>
      </div>

      <div class="side-section" id="upgrades-tab">
        <div class="section-title">Click Power</div>
        <div id="clickUpgradesList" class="upgrade-list"></div>
      </div>

      <div class="side-section" id="achievements-tab">
        <div class="section-title">Your Achievements</div>
        <div id="achievementsList" class="achievement-list"></div>
      </div>

      <div class="side-section">
        <div class="stats-grid">
          <div class="stat-key">Total Earned</div>
          <div id="totalEarned" class="stat-value-small">0</div>

          <div class="stat-key">Total Clicks</div>
          <div id="totalClicks" class="stat-value-small">0</div>

          <div class="stat-key">Peak CPS</div>
          <div id="peakCps" class="stat-value-small">0</div>

          <div class="stat-key">Buildings</div>
          <div id="totalBuildings" class="stat-value-small">0</div>
        </div>
        <button id="resetBtn" class="reset-btn" style="margin-top: 12px;">Reset Game</button>
      </div>
    </aside>
  </div>

  <script>
    (() => {
      // Sound system
      const audioContext = (() => {
        try {
          return new (window.AudioContext || window.webkitAudioContext)();
        } catch {
          return null;
        }
      })();

      let soundEnabled = localStorage.getItem('cookie-clicker-sound') !== 'false';

      function playSound(freq = 800, duration = 50, type = 'sine') {
        if (!soundEnabled || !audioContext) return;
        try {
          const now = audioContext.currentTime;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          
          osc.connect(gain);
          gain.connect(audioContext.destination);
          
          osc.type = type;
          osc.frequency.value = freq;
          
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + duration / 1000);
          
          osc.start(now);
          osc.stop(now + duration / 1000);
        } catch (e) {}
      }

      const state = {
        cookies: 0,
        totalClicks: 0,
        totalEarned: 0,
        perClick: 1,
        cps: 0,
        peakCps: 0,
        lastSaveTime: Date.now(),
        pendingUpdates: false,
        buildings: [
          { name: 'Cursor', baseCost: 15, cps: 0.1, owned: 0 },
          { name: 'Grandma', baseCost: 100, cps: 1, owned: 0 },
          { name: 'Farm', baseCost: 1100, cps: 8, owned: 0 },
          { name: 'Bank', baseCost: 12000, cps: 47, owned: 0 },
          { name: 'Factory', baseCost: 130000, cps: 260, owned: 0 },
          { name: 'Temple', baseCost: 1400000, cps: 1400, owned: 0 },
          { name: 'Portal', baseCost: 20000000, cps: 7800, owned: 0 },
          { name: 'Dimension', baseCost: 330000000, cps: 44000, owned: 0 },
          { name: 'Supernova', baseCost: 5100000000, cps: 260000, owned: 0 }
        ],
        clickUpgrades: [
          { name: 'Better Fingers', cost: 100, effect: 1, owned: false, desc: '+1 per click' },
          { name: 'Cursor Force', cost: 500, effect: 2, owned: false, desc: '+2 per click' },
          { name: 'Iron Fingers', cost: 2000, effect: 5, owned: false, desc: '+5 per click' },
          { name: 'Titanium Fingers', cost: 10000, effect: 10, owned: false, desc: '+10 per click' },
          { name: 'Golden Touch', cost: 50000, effect: 25, owned: false, desc: '+25 per click' },
          { name: 'Quantum Fingers', cost: 250000, effect: 50, owned: false, desc: '+50 per click' },
          { name: 'Divine Intervention', cost: 1000000, effect: 100, owned: false, desc: '+100 per click' }
        ],
        achievements: [
          { id: 'first', name: 'First Bite', icon: '🍪', desc: 'Bake your first cookie', unlocked: false, check: () => state.totalClicks >= 1 },
          { id: 'hundred', name: 'Centennial', icon: '💯', desc: 'Earn 100 cookies', unlocked: false, check: () => state.totalEarned >= 100, progress: () => Math.min(100, state.totalEarned) },
          { id: 'thousand', name: 'Millionaire', icon: '💰', desc: 'Earn 1,000 cookies', unlocked: false, check: () => state.totalEarned >= 1000, progress: () => Math.min(1000, state.totalEarned) },
          { id: 'million', name: 'Billionaire', icon: '🏦', desc: 'Earn 1,000,000 cookies', unlocked: false, check: () => state.totalEarned >= 1000000, progress: () => Math.min(1000000, state.totalEarned) },
          { id: 'rapid', name: 'Rapid Clicker', icon: '⚡', desc: 'Click 100 times', unlocked: false, check: () => state.totalClicks >= 100, progress: () => Math.min(100, state.totalClicks) },
          { id: 'frenzy', name: 'Click Frenzy', icon: '🔥', desc: 'Click 1,000 times', unlocked: false, check: () => state.totalClicks >= 1000, progress: () => Math.min(1000, state.totalClicks) },
          { id: 'grandma', name: 'Grandma Approved', icon: '👵', desc: 'Own 5 Grandmas', unlocked: false, check: () => state.buildings[1].owned >= 5, progress: () => Math.min(5, state.buildings[1].owned) },
          { id: 'farm', name: 'Farm Fresh', icon: '🌾', desc: 'Own 10 Farms', unlocked: false, check: () => state.buildings[2].owned >= 10, progress: () => Math.min(10, state.buildings[2].owned) },
          { id: 'cps100', name: 'Steady Producer', icon: '📈', desc: 'Reach 100 CPS', unlocked: false, check: () => state.cps >= 100, progress: () => Math.min(100, state.cps) },
          { id: 'cps1000', name: 'Production Master', icon: '🏭', desc: 'Reach 1,000 CPS', unlocked: false, check: () => state.cps >= 1000, progress: () => Math.min(1000, state.cps) },
          { id: 'powerup', name: 'Finger Boost', icon: '💪', desc: 'Buy a Click Power upgrade', unlocked: false, check: () => state.clickUpgrades.some(u => u.owned) },
          { id: 'allpower', name: 'Ultimate Fingers', icon: '🌟', desc: 'Buy all Click Power upgrades', unlocked: false, check: () => state.clickUpgrades.every(u => u.owned) }
        ]
      };

      const els = {
        cookies: document.getElementById('cookies'),
        totalClicks: document.getElementById('totalClicks'),
        cps: document.getElementById('cps'),
        cpsLabel: document.getElementById('cpsLabel'),
        totalEarned: document.getElementById('totalEarned'),
        perClick: document.getElementById('perClick'),
        peakCps: document.getElementById('peakCps'),
        totalBuildings: document.getElementById('totalBuildings'),
        upgradeList: document.getElementById('upgradeList'),
        clickUpgradesList: document.getElementById('clickUpgradesList'),
        achievementsList: document.getElementById('achievementsList'),
        cookie: document.getElementById('cookie'),
        resetBtn: document.getElementById('resetBtn'),
        soundToggle: document.getElementById('soundToggle'),
        floatingContainer: document.getElementById('floatingContainer')
      };

      function formatShort(n) {
        if (!Number.isFinite(n)) return '0';
        const abs = Math.abs(n);
        if (abs < 1000) return Math.floor(n).toString();

        const units = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'De'];
        let unit = 0;
        let value = abs;

        while (value >= 1000 && unit < units.length - 1) {
          value /= 1000;
          unit++;
        }

        const text = value >= 100 ? value.toFixed(0) : value.toFixed(2).replace(/\.00$/, '').replace(/(\.\d)0$/, '$1');
        return text + units[unit];
      }

      function getCost(b) {
        return Math.floor(b.baseCost * Math.pow(1.15, b.owned));
      }

      function getTotalBuildings() {
        return state.buildings.reduce((sum, b) => sum + b.owned, 0);
      }

      function showNotification(text, icon = '✓') {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.textContent = `${icon} ${text}`;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
      }

      function checkAchievements() {
        state.achievements.forEach(ach => {
          if (!ach.unlocked && ach.check()) {
            ach.unlocked = true;
            showNotification(`Achievement: ${ach.name}!`, ach.icon);
            playSound(1000, 150);
            state.pendingUpdates = true;
          }
        });
      }

      function renderUpgrades() {
        els.upgradeList.innerHTML = '';
        state.buildings.forEach((b, index) => {
          const cost = getCost(b);
          const affordable = state.cookies >= cost;
          const div = document.createElement('div');
          div.className = 'upgrade' + (affordable ? ' affordable' : '');
          div.innerHTML = `
            <div class="upgrade-name">${b.name} ×${b.owned}</div>
            <div class="upgrade-cost">Cost: ${formatShort(cost)}</div>
            <div class="upgrade-effect">+${formatShort(b.cps)} CPS</div>
          `;
          div.addEventListener('click', () => buyBuilding(index));
          els.upgradeList.appendChild(div);
        });
      }

      function renderClickUpgrades() {
        els.clickUpgradesList.innerHTML = '';
        state.clickUpgrades.forEach((upg, index) => {
          const affordable = state.cookies >= upg.cost && !upg.owned;
          const div = document.createElement('div');
          div.className = 'upgrade' + (affordable ? ' affordable' : '') + (upg.owned ? ' purchased' : '');
          div.innerHTML = `
            <div class="upgrade-name">${upg.name}</div>
            <div class="upgrade-cost">Cost: ${formatShort(upg.cost)}</div>
            <div class="upgrade-effect">${upg.desc}${upg.owned ? ' ✓' : ''}</div>
          `;
          div.addEventListener('click', () => buyClickUpgrade(index));
          els.clickUpgradesList.appendChild(div);
        });
      }

      function renderAchievements() {
        els.achievementsList.innerHTML = '';
        state.achievements.forEach(ach => {
          const div = document.createElement('div');
          div.className = 'achievement' + (ach.unlocked ? ' unlocked' : ' locked');
          const progress = ach.progress ? ` (${formatShort(ach.progress())} / ${ach.id === 'allpower' ? '7' : '?'})` : '';
          div.innerHTML = `
            <div class="achievement-header">
              <div class="achievement-icon">${ach.icon}</div>
              <div class="achievement-info">
                <div class="achievement-name">${ach.name}</div>
                <div class="achievement-desc">${ach.desc}</div>
                ${ach.progress ? `<div class="achievement-progress">${progress}</div>` : ''}
              </div>
            </div>
          `;
          els.achievementsList.appendChild(div);
        });
      }

      function updateDisplay() {
        els.cookies.textContent = formatShort(state.cookies);
        els.totalClicks.textContent = formatShort(state.totalClicks);
        els.cps.textContent = formatShort(state.cps);
        els.cpsLabel.textContent = `Cookies per second: ${formatShort(state.cps)}`;
        els.totalEarned.textContent = formatShort(state.totalEarned);
        els.perClick.textContent = formatShort(state.perClick);
        els.peakCps.textContent = formatShort(state.peakCps);
        els.totalBuildings.textContent = getTotalBuildings();
        renderUpgrades();
        renderClickUpgrades();
        renderAchievements();
      }

      function spawnFloat(x, y, text) {
        const el = document.createElement('div');
        el.className = 'floating';
        el.textContent = text;
        el.style.left = (x - 20) + 'px';
        el.style.top = (y - 20) + 'px';
        els.floatingContainer.appendChild(el);

        const start = performance.now();
        function frame(now) {
          const t = (now - start) / 600;
          el.style.transform = `translate(0px, ${-t * 80}px)`;
          el.style.opacity = String(Math.max(0, 1 - t));
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            el.remove();
          }
        }
        requestAnimationFrame(frame);
      }

      function processClick(pointerEvent) {
        state.totalClicks += 1;
        state.cookies += state.perClick;
        state.totalEarned += state.perClick;
        state.pendingUpdates = true;

        const x = pointerEvent.clientX || (pointerEvent.touches?.[0]?.clientX || window.innerWidth / 2);
        const y = pointerEvent.clientY || (pointerEvent.touches?.[0]?.clientY || window.innerHeight / 2);
        
        spawnFloat(x, y, `+${formatShort(state.perClick)}`);
        playSound(800, 50);
        checkAchievements();
      }

      function buyBuilding(index) {
        const b = state.buildings[index];
        const cost = getCost(b);
        if (state.cookies < cost) return;

        state.cookies -= cost;
        b.owned += 1;
        state.cps += b.cps;
        if (state.cps > state.peakCps) state.peakCps = state.cps;
        
        playSound(1200, 100);
        state.pendingUpdates = true;
        checkAchievements();
        saveGame();
      }

      function buyClickUpgrade(index) {
        const upg = state.clickUpgrades[index];
        if (upg.owned || state.cookies < upg.cost) return;

        state.cookies -= upg.cost;
        upg.owned = true;
        state.perClick += upg.effect;
        
        playSound(1400, 150);
        showNotification(`${upg.name} unlocked!`, '💪');
        state.pendingUpdates = true;
        checkAchievements();
        saveGame();
      }

      function saveGame() {
        const payload = {
          cookies: Math.floor(state.cookies),
          totalClicks: state.totalClicks,
          totalEarned: Math.floor(state.totalEarned),
          perClick: state.perClick,
          cps: state.cps,
          peakCps: state.peakCps,
          buildings: state.buildings.map(b => ({ owned: b.owned })),
          clickUpgrades: state.clickUpgrades.map(u => ({ owned: u.owned })),
          achievements: state.achievements.map(a => ({ id: a.id, unlocked: a.unlocked }))
        };
        localStorage.setItem('cookie-clicker-ultra-save', JSON.stringify(payload));
      }

      function loadGame() {
        try {
          const raw = localStorage.getItem('cookie-clicker-ultra-save');
          if (!raw) return;
          const saved = JSON.parse(raw);
          if (!saved) return;

          state.cookies = Number(saved.cookies) || 0;
          state.totalClicks = Number(saved.totalClicks) || 0;
          state.totalEarned = Number(saved.totalEarned) || 0;
          state.perClick = Number(saved.perClick) || 1;
          state.cps = Number(saved.cps) || 0;
          state.peakCps = Number(saved.peakCps) || 0;

          if (Array.isArray(saved.buildings)) {
            saved.buildings.forEach((entry, i) => {
              if (state.buildings[i]) state.buildings[i].owned = Number(entry.owned) || 0;
            });
          }

          if (Array.isArray(saved.clickUpgrades)) {
            saved.clickUpgrades.forEach((entry, i) => {
              if (state.clickUpgrades[i]) state.clickUpgrades[i].owned = Boolean(entry.owned);
            });
          }

          if (Array.isArray(saved.achievements)) {
            saved.achievements.forEach(entry => {
              const ach = state.achievements.find(a => a.id === entry.id);
              if (ach) ach.unlocked = Boolean(entry.unlocked);
            });
          }

          updateDisplay();
        } catch (e) {
          console.warn('Save load failed', e);
        }
      }

      function resetGame() {
        if (!confirm('Are you sure? This will reset everything!')) return;
        state.cookies = 0;
        state.totalClicks = 0;
        state.totalEarned = 0;
        state.perClick = 1;
        state.cps = 0;
        state.peakCps = 0;
        state.buildings.forEach(b => { b.owned = 0; });
        state.clickUpgrades.forEach(u => { u.owned = false; });
        state.achievements.forEach(a => { a.unlocked = false; });
        localStorage.removeItem('cookie-clicker-ultra-save');
        updateDisplay();
        playSound(400, 200);
      }

      function loop(now) {
        const dt = (now - state.lastFrame) / 1000;
        state.lastFrame = now;

        if (dt > 0 && dt < 0.1) {
          state.cookies += state.cps * dt;
          state.totalEarned += state.cps * dt;
          if (state.cps > state.peakCps) state.peakCps = state.cps;
          
          // Batch updates - only update display when needed
          if (state.pendingUpdates || Date.now() - state.lastSaveTime > 200) {
            updateDisplay();
            state.pendingUpdates = false;
          }

          // Auto-save every 3 seconds
          if (Date.now() - state.lastSaveTime > 3000) {
            saveGame();
            state.lastSaveTime = Date.now();
          }
        }

        requestAnimationFrame(loop);
      }

      // Tab system
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.side-section').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
        });
      });

      // Click handler with debouncing for massive click rates
      let lastClickTime = 0;
      const clickDebounce = 10; // Only show floats every 10ms at most

      els.cookie.addEventListener('pointerdown', (e) => {
        processClick(e);
        const now = Date.now();
        if (now - lastClickTime > clickDebounce) {
          saveGame();
          lastClickTime = now;
        }
      }, { passive: true });

      els.cookie.addEventListener('touchstart', (e) => {
        processClick(e);
        const now = Date.now();
        if (now - lastClickTime > clickDebounce) {
          saveGame();
          lastClickTime = now;
        }
      }, { passive: true });

      els.resetBtn.addEventListener('click', resetGame);

      els.soundToggle.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('cookie-clicker-sound', soundEnabled ? 'true' : 'false');
        els.soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
      });

      window.addEventListener('beforeunload', saveGame);
      window.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') saveGame();
      });

      loadGame();
      updateDisplay();
      els.soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
      state.lastFrame = performance.now();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
